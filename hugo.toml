baseURL = 'https://blog.dahlmannonline.com/'
locale = 'de-DE'
defaultContentLanguage = 'de'
title = 'DahlmannOnline Blog'
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  env = 'production'
  title = 'DahlmannOnline Blog'
  description = 'Praxisnahe Anleitungen und persönliche Beiträge zu Unterricht, Schul-IT, digitaler Arbeitsorganisation und Open Source.'
  author = 'Stefan Dahlmann'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = true

[params.homeInfoParams]
  Title = 'Willkommen bei DahlmannOnline'
  Content = 'Praxisnahe Anleitungen und persönliche Beiträge zu Unterricht, Schul-IT, digitaler Arbeitsorganisation und Open Source.'

[[menu.main]]
  identifier = 'anleitungen'
  name = 'Anleitungen'
  url = '/anleitungen/'
  weight = 5

[[menu.main]]
  identifier = 'posts'
  name = 'Beiträge'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'archives'
  name = 'Archiv'
  url = '/archives/'
  weight = 30

[[menu.main]]
  identifier = 'suche'
  name = 'Suche'
  url = '/suche/'
  weight = 40

[privacy.youtube]
  privacyEnhanced = true

[markup.goldmark.renderer]
  unsafe = true
